services:
  - type: web
    name: bin-saeed-outlet
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn kirmani_store.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: False
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bin-saeed-db
          property: connectionString

databases:
  - name: bin-saeed-db
    plan: free
